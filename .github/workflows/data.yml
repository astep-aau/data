name: data

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      archive_present: ${{ steps.archive.outputs.present }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: check archive
        id: archive
        run: |
          if [ -f bj_data.zip ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "bj_data.zip is missing; image publish skipped"
          fi

      - name: check python
        run: python -m py_compile import_data.py

  build-and-push:
    needs: check
    if: needs.check.outputs.archive_present == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/data:latest
            ghcr.io/${{ github.repository_owner }}/data:${{ github.sha }}
